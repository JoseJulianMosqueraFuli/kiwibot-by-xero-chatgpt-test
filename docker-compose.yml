services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api

  test-api:
    build: .
    command: pytest tests/ -v
    env_file: .env

  test-frontend:
    build:
      context: ./frontend
      target: build
    command: pnpm test
